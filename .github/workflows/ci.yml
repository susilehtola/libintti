# SPDX-License-Identifier: BSD-3-Clause
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-serial
            cc: gcc
            cxx: g++
            cmake_args: ""
          - name: gcc-openmp
            cc: gcc
            cxx: g++
            cmake_args: "-DKokkos_ENABLE_OPENMP=ON"
          - name: clang-serial
            cc: clang
            cxx: clang++
            cmake_args: ""
          - name: gcc-quadmath
            cc: gcc
            cxx: g++
            cmake_args: "-DINTTI_ENABLE_QUADMATH=ON"
    steps:
      - uses: actions/checkout@v4
      - name: Install LAPACK
        run: sudo apt-get update && sudo apt-get install -y liblapack-dev
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}
      - name: Build
        run: cmake --build build -j $(nproc)
      - name: Test
        run: ctest --test-dir build --output-on-failure

  references:
    # Re-derive the analytic test oracles symbolically with SymPy; each script
    # asserts its results, so a drift between a hard-coded C++ oracle and its
    # closed form fails CI here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install SymPy and NumPy
        run: pip install sympy numpy
      - name: Derive symbolic references
        run: |
          for f in references/sympy_*.py; do
            echo "== $f =="
            python "$f"
          done
      - name: Check numerical three-electron references
        # Gauss-Hermite vs Gauss-Legendre quadrature; does not regenerate the
        # committed header, only verifies the two independent rules agree.
        run: python references/te_reference.py

  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LAPACK
        run: sudo apt-get update && sudo apt-get install -y liblapack-dev
      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
      - name: Build
        run: cmake --build build -j $(nproc)
      - name: Test
        run: ctest --test-dir build --output-on-failure

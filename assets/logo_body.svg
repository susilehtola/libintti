      <path d="M 240 60 C 300 40 360 70 380 120 C 400 170 340 190 300 160 C 260 130 210 90 240 60 Z" fill="#6A5334"/>
      <path d="M 400 40 C 450 30 500 70 480 120 C 460 170 400 150 390 110 C 383 80 380 45 400 40 Z" fill="#99A06E"/>
      <path d="M 300 200 C 360 190 420 220 430 270 C 440 320 380 340 330 310 C 280 280 250 220 300 200 Z" fill="#414B2B"/>
      <path d="M 80 220 C 140 210 180 250 170 300 C 160 350 100 360 70 320 C 40 280 30 230 80 220 Z" fill="#6A5334"/>
      <path d="M 200 260 C 250 250 290 290 270 330 C 250 370 190 360 175 320 C 162 285 165 268 200 260 Z" fill="#99A06E"/>
      <path d="M 380 340 C 440 330 490 370 470 420 C 450 470 380 470 355 425 C 335 388 340 348 380 340 Z" fill="#414B2B"/>
      <path d="M 120 380 C 180 370 230 400 220 450 C 210 500 140 500 110 460 C 82 422 80 390 120 380 Z" fill="#6A5334"/>
      <path d="M 260 400 C 310 390 350 420 340 460 C 330 500 270 505 250 470 C 233 440 235 408 260 400 Z" fill="#99A06E"/>
      <path d="M 20 320 C 60 300 90 340 70 380 C 50 420 10 410 5 370 C 2 345 5 328 20 320 Z" fill="#414B2B"/>
      <path d="M 430 180 C 480 170 510 210 495 250 C 480 290 430 280 420 240 C 412 208 415 185 430 180 Z" fill="#99A06E"/>
      <path d="M 150 30 C 190 20 215 45 205 70 C 195 95 155 90 145 65 C 138 48 138 33 150 30 Z" fill="#6A5334"/>
      <path d="M 460 300 C 500 295 512 330 500 360 C 488 390 455 380 450 350 C 446 325 445 303 460 300 Z" fill="#414B2B"/>
      <path d="M 30 430 C 70 420 95 450 85 478 C 75 505 35 500 25 470 C 18 448 18 434 30 430 Z" fill="#99A06E"/>
      <path d="M 170 150 C 205 140 232 165 222 192 C 212 220 172 218 158 194 C 146 173 150 156 170 150 Z" fill="#414B2B"/>
      <path d="M 250 230 C 285 222 305 248 292 272 C 279 296 243 292 234 268 C 226 246 232 234 250 230 Z" fill="#6A5334"/>
      <path d="M 110 250 C 145 244 162 272 148 292 C 133 313 100 306 94 282 C 89 262 95 253 110 250 Z" fill="#99A06E"/>
      <path d="M 330 155 C 362 148 382 172 370 194 C 358 217 324 212 316 190 C 309 170 315 158 330 155 Z" fill="#6A5334"/>
      <path d="M 355 235 C 388 228 408 254 394 276 C 380 299 346 292 340 268 C 335 248 341 238 355 235 Z" fill="#99A06E"/>
      <path d="M 205 185 C 232 179 248 200 238 219 C 228 239 200 235 193 216 C 187 200 192 188 205 185 Z" fill="#99A06E"/>
      <path d="M 288 190 C 312 185 326 205 316 222 C 306 240 281 236 275 219 C 270 205 276 193 288 190 Z" fill="#414B2B"/>
      <path d="M 145 300 C 175 294 192 316 180 334 C 168 353 138 348 132 328 C 127 311 133 303 145 300 Z" fill="#414B2B"/>
      <path d="M 60 160 C 90 154 108 176 96 195 C 84 214 54 208 48 188 C 43 171 48 163 60 160 Z" fill="#99A06E"/>
      <path d="M 440 120 C 470 114 488 136 476 155 C 464 174 434 168 428 148 C 423 131 428 123 440 120 Z" fill="#6A5334"/>
      <path d="M 415 380 C 445 374 463 396 451 415 C 439 434 409 428 403 408 C 398 391 403 383 415 380 Z" fill="#6A5334"/>
      <path d="M 60 370 C 90 364 108 386 96 405 C 84 424 54 418 48 398 C 43 381 48 373 60 370 Z" fill="#414B2B"/>
    </g>

    <!-- tent silhouette -->
    <clipPath id="tentClip">
      <path d="M 248 128 C 214 178 160 250 98 300 L 410 300 C 356 250 288 176 248 128 Z"/>
    </clipPath>
    <clipPath id="frontFaceClip">
      <path d="M 248 128 C 214 178 160 250 98 300 L 306 300 Z"/>
    </clipPath>
    <clipPath id="sideFaceClip">
      <path d="M 248 128 L 306 300 L 410 300 C 356 250 288 176 248 128 Z"/>
    </clipPath>

    <!-- broken camo ring: a dashed stroke used as a mask -->
    <mask id="ringMask">
      <circle cx="256" cy="256" r="200" fill="none" stroke="#fff" stroke-width="20"
              stroke-dasharray="150 26" stroke-dashoffset="60"/>
    </mask>

    <linearGradient id="pipeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6E766B"/>
      <stop offset="0.35" stop-color="#B9BFB4"/>
      <stop offset="0.75" stop-color="#8D948A"/>
      <stop offset="1" stop-color="#5E665C"/>
    </linearGradient>
  </defs>

  <!-- ================= patch body ================= -->
  <circle cx="256" cy="256" r="250" fill="#212A18"/>
  <circle cx="256" cy="256" r="245" fill="#A7AEA4"/>
  <circle cx="256" cy="256" r="245" fill="none" stroke="#878F84" stroke-width="2"/>
  <circle cx="256" cy="256" r="222" fill="#212A18"/>
  <circle cx="256" cy="256" r="217" fill="#2F3B21"/>

  <!-- ================= camo ring ================= -->
  <g mask="url(#ringMask)">
    <use href="#camo"/>
  </g>

  <!-- ================= tent ================= -->
  <g>
    <!-- front face -->
    <g clip-path="url(#frontFaceClip)">
      <use href="#camo"/>
    </g>
    <!-- side face, shaded -->
    <g clip-path="url(#sideFaceClip)">
      <use href="#camo"/>
      <rect x="0" y="0" width="512" height="512" fill="#1B2413" opacity="0.30"/>
    </g>
    <!-- ridge and outline -->
    <path d="M 248 128 L 306 300" stroke="#222E17" stroke-width="3" fill="none"/>
    <path d="M 248 128 C 214 178 160 250 98 300 L 410 300 C 356 250 288 176 248 128 Z"
          fill="none" stroke="#222E17" stroke-width="4" stroke-linejoin="round"/>
    <!-- doorway -->
    <path d="M 202 300 L 240 198 L 278 300 Z" fill="#22301A"/>
    <path d="M 202 300 L 240 198 L 278 300" fill="none" stroke="#151E0F" stroke-width="2"/>
    <!-- ground shadow -->
    <rect x="98" y="296" width="312" height="6" fill="#1B2413" opacity="0.55"/>
  </g>

  <!-- ================= stove pipe ================= -->
  <g>
    <!-- roof flashing plate -->
    <g transform="rotate(47 320 248)">
      <rect x="288" y="227" width="64" height="42" rx="4" fill="#2A331E" stroke="#8B9287" stroke-width="2.5"/>
      <circle cx="296" cy="235" r="2.4" fill="#8B9287"/>
      <circle cx="344" cy="235" r="2.4" fill="#8B9287"/>
      <circle cx="296" cy="261" r="2.4" fill="#8B9287"/>
      <circle cx="344" cy="261" r="2.4" fill="#8B9287"/>
    </g>
    <!-- pipe -->
    <rect x="306" y="125" width="27" height="133" fill="url(#pipeGrad)" stroke="#3E4739" stroke-width="2"/>
    <line x1="306" y1="165" x2="333" y2="165" stroke="#5C6459" stroke-width="2"/>
    <line x1="306" y1="210" x2="333" y2="210" stroke="#5C6459" stroke-width="2"/>
    <!-- cap -->
    <path d="M 319.5 100 L 300 127 L 339 127 Z" fill="#A7AEA4" stroke="#3E4739" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- ================= integral ================= -->
<!--INTEGRAL-->

  <!-- ================= smoke (drawn last, over the ring) ================= -->
  <g fill="#F4F2EA">
    <path d="M 300 110 C 286 105 284 86 297 80 C 294 66 308 56 319 62
             C 326 50 344 53 348 65 C 360 68 361 84 350 90
             C 352 101 340 111 329 106 C 321 114 307 115 300 110 Z"/>
    <path d="M 330 60 C 324 56 326 46 334 46 C 338 40 348 43 348 50
             C 353 54 350 62 343 62 C 339 66 333 65 330 60 Z" opacity="0.9"/>
  </g>
  <g fill="#D9D9CD" opacity="0.55">
    <path d="M 299 100 C 292 96 292 86 300 84 C 305 92 303 98 299 100 Z"/>
    <path d="M 344 84 C 350 80 352 72 346 68 C 342 76 342 82 344 84 Z"/>
  </g>

  <!-- ================= lettering ================= -->
<!--LETTERING-->
</svg>
